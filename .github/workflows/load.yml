name: Load

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenarios to run, from public, signedIn and generate
        default: public,signedIn,generate
      steps:
        description: Target requests per second of each public page step
        default: "20,40,80,160,320"

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_DEV_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_DEV_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          OPENAI_API_KEY: build-placeholder
      - name: Start the mock model and the app
        run: |
          node e2e/support/mock-openai.ts &
          pnpm start &
          for _ in $(seq 1 60); do curl --silent --fail --output /dev/null http://localhost:3000/ && exit 0; sleep 1; done
          exit 1
        env:
          OPENAI_BASE_URL: http://127.0.0.1:4010/v1
          OPENAI_API_KEY: load-test
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.1.0
      - run: k6 run load/k6.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_DEV_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_DEV_KEY }}
          SCENARIOS: ${{ inputs.scenarios }}
          STEPS: ${{ inputs.steps }}
      - name: Add the results to the summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Load test" >> "$GITHUB_STEP_SUMMARY"
          cat reports/load/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: load-report
          path: reports/load/
          retention-days: 7

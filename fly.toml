# fly.toml app configuration file generated for kelana on 2025-11-29T19:33:10+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kelana'
primary_region = 'sin'

[build]

  # NEXT_PUBLIC_* values are inlined into the browser bundle at build time, so they are build args, not secrets.
  # They are public by design: the publishable key is only usable within the limits of Row-Level Security.
  [build.args]
    NEXT_PUBLIC_SUPABASE_URL = 'https://caeawmpnhnipzknsllce.supabase.co'
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_UDj1Kes-mVUxMcB6IWN9CA_TBLW8vsV'
    NEXT_PUBLIC_SITE_URL = 'https://kelana.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Itinerary generation can take a couple of minutes in a single request.
  [http_service.http_options]
    idle_timeout = 600

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
